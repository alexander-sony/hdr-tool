[project]
name = "hdr-tool"
version = "0.1.0"
description = "HDR parameter suggestion and test-image tools for IMX900-style raw frames"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]
[project.scripts]
hdr-suggest = "hdr_suggest.cli:main"
hdr-curves = "hdr_curves.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hdr_suggest", "hdr_curves"]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
ignore = ["UP045"]
